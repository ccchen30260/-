      const [filterType, setFilterType] = useState("ALL");

      // Modals
      const [assignModal, setAssignModal] = useState({ open: false, machineId: null, role: null });

      // Time

        localStorage.setItem("mfg_board_machines_v8", JSON.stringify(machines));
        localStorage.setItem("mfg_board_machine_types_v3", JSON.stringify(machineTypes));
        localStorage.setItem("mfg_board_current_shift_v3", currentShift);

        localStorage.setItem("mfg_board_attendance_v6", JSON.stringify(attendanceMap));
      }, [machines, machineTypes, currentShift, mStatusOptions, matStatusOptions, skillGroups, attendanceMap]);

      useEffect(() => {
        if (!supabaseUrl || !supabaseKey || !window.supabase) {
          setSupabaseConnected(false);
          return;
        }

        try {
          const client = window.supabase.createClient(supabaseUrl, supabaseKey);
          supabaseRef.current = client;

          // Fetch Initial State from Supabase
          const fetchInitial = async () => {
            const { data, error } = await client.from('mfg_board').select('*').eq('id', 'global_state').single();
            if (data && data.data) {
              const state = data.data;
              if (state.machines) setMachines(state.machines);
              if (state.currentShift) setCurrentShift(state.currentShift);
              if (state.machineTypes) setMachineTypes(state.machineTypes);
              if (state.mStatusOptions) setMStatusOptions(state.mStatusOptions);
              if (state.matStatusOptions) setMatStatusOptions(state.matStatusOptions);
              if (state.skillGroups) setSkillGroups(state.skillGroups);
              if (state.attendanceMap) setAttendanceMap(state.attendanceMap);
            }
            setSupabaseConnected(true);
          };

          fetchInitial();

          // Subscribe to Realtime Postgres Changes
          const channel = client
            .channel('public:mfg_board')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'mfg_board' }, (payload) => {
              if (payload.new && payload.new.id === 'global_state' && payload.new.data) {
                const state = payload.new.data;
                if (state.machines) setMachines(state.machines);
                if (state.currentShift) setCurrentShift(state.currentShift);
                if (state.machineTypes) setMachineTypes(state.machineTypes);
                if (state.mStatusOptions) setMStatusOptions(state.mStatusOptions);
                if (state.matStatusOptions) setMatStatusOptions(state.matStatusOptions);
                if (state.skillGroups) setSkillGroups(state.skillGroups);
                if (state.attendanceMap) setAttendanceMap(state.attendanceMap);
              }
            })
            .subscribe();

          return () => {
            client.removeChannel(channel);
          };
        } catch (err) {
          console.error("Supabase connection error:", err);
          setSupabaseConnected(false);
        }
      }, [supabaseUrl, supabaseKey]);

      // Helper to Push Full State to Supabase
      const pushToSupabase = async (overrideState = {}) => {
        if (!supabaseRef.current || !supabaseConnected) return;

        const payload = {
          machines,
          currentShift,
          machineTypes,
          mStatusOptions,
          matStatusOptions,
          skillGroups,
          attendanceMap,
          ...overrideState
        };

        try {
          await supabaseRef.current.from('mfg_board').upsert({
            id: 'global_state',
            data: payload,
            updated_at: new Date()
          });
        } catch (err) {
          console.error("Failed to push state to Supabase:", err);
        }
      };

      const showNotice = (text, type = "info") => {
        setNoticeMessage({ text, type });
        setTimeout(() => setNoticeMessage(null), 3000);
      };

      const handleSaveSupabaseCredentials = (e) => {
        e.preventDefault();
        localStorage.setItem("mfg_supabase_url", supabaseUrl.trim());
        localStorage.setItem("mfg_supabase_key", supabaseKey.trim());
        setShowSupabaseModal(false);
        showNotice("已儲存 Supabase 連線設定！系統將自動連接...", "success");
      };

      const handleShiftChange = (newShift) => {
        if (newShift === currentShift) return;
        setCurrentShift(newShift);
        const newSupport = SHIFT_PAIR_MAP[newShift];
        pushToSupabase({ currentShift: newShift });
        showNotice(`已切換當班班別為 [${newShift}]（支援班別：${newSupport}）`, "info");
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (inputPassword === adminPassword) {
          setUserRole("admin");
          setInputPassword("");
          setLoginError("");
          showNotice("登入成功！歡迎使用管理員權限", "success");
        } else {
          setLoginError("密碼錯誤！(預設密碼為 0000)");
        }
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        if (pwForm.oldPw !== adminPassword) {
          setPwError("原密碼輸入錯誤！");
          return;
        }
        if (pwForm.newPw.length < 4) {
          setPwError("新密碼長度至少需 4 個字元！");
          return;
        }
        if (pwForm.newPw !== pwForm.confirmPw) {
          setPwError("兩次輸入的新密碼不一致！");
          return;
        }
        setAdminPassword(pwForm.newPw);
        localStorage.setItem("mfg_board_admin_pw_v3", pwForm.newPw);
        setShowChangePwModal(false);
        setPwForm({ oldPw: "", newPw: "", confirmPw: "" });
        setPwError("");
        showNotice("密碼已成功更新！", "success");
      };

      const handleAddMachineType = () => {
        const name = newTypeName.trim();
        if (!name) return;
        if (machineTypes.includes(name)) {
          showNotice("此機台類型已存在！", "error");
          return;
        }
        const updated = [...machineTypes, name];
        setMachineTypes(updated);
        setNewTypeName("");
        pushToSupabase({ machineTypes: updated });
        showNotice(`已新增機台類型 [${name}]`, "success");
      };

      const handleSaveEditMachineType = (index) => {
        const val = editingTypeValue.trim();
        if (!val) return;
        const oldType = machineTypes[index];
        const updatedTypes = machineTypes.map((t, i) => i === index ? val : t);
        const updatedMachines = machines.map(m => m.type === oldType ? { ...m, type: val } : m);
        setMachineTypes(updatedTypes);
        setMachines(updatedMachines);
        setEditingTypeIndex(null);
        setEditingTypeValue("");
        pushToSupabase({ machineTypes: updatedTypes, machines: updatedMachines });
        showNotice("已修改類型名稱！", "success");
      };

      const handleDeleteMachineType = (typeName) => {
        setConfirmDialog({
          open: true,
          title: "刪除機台類型確認",
          message: `確定要刪除「${typeName}」機台類型嗎？`,
          onConfirm: () => {
            const updatedTypes = machineTypes.filter(t => t !== typeName);
            setMachineTypes(updatedTypes);
            if (newMachine.type === typeName) {
              setNewMachine(prev => ({ ...prev, type: updatedTypes[0] || "" }));
            }
            if (filterType === typeName) setFilterType("ALL");
            pushToSupabase({ machineTypes: updatedTypes });
            showNotice(`已刪除機台類型 [${typeName}]`, "info");
          }
        });
      };

      const getMatchingSkillGroups = (machineName) => {
        return skillGroups.filter(g => g.machines && g.machines.includes(machineName));
      };

      const handleAddGroup = () => {
        const newG = {
          id: "sg-" + Date.now(),
          name: "新技能分組",
          machines: [],
          members: []
        };
        const updated = [...skillGroups, newG];
        setSkillGroups(updated);
        setSelectedGroupId(newG.id);
        pushToSupabase({ skillGroups: updated });
        showNotice("已建立新分組，請設定涵蓋機台與人員", "info");
      };

      const handleUpdateGroupName = (id, newName) => {
        const updated = skillGroups.map(g => g.id === id ? { ...g, name: newName } : g);
        setSkillGroups(updated);
        pushToSupabase({ skillGroups: updated });
      };

      const handleToggleMachineInGroup = (groupId, machineName) => {
        const updated = skillGroups.map(g => {
          if (g.id !== groupId) return g;
          const exists = g.machines.includes(machineName);
          const machinesList = exists ? g.machines.filter(m => m !== machineName) : [...g.machines, machineName];
          return { ...g, machines: machinesList };
        });
        setSkillGroups(updated);
        pushToSupabase({ skillGroups: updated });
      };

      const handleToggleMemberInGroup = (groupId, personName) => {
        const updated = skillGroups.map(g => {
          if (g.id !== groupId) return g;
          const exists = g.members.includes(personName);
          const members = exists ? g.members.filter(m => m !== personName) : [...g.members, personName];
          return { ...g, members };
        });
        setSkillGroups(updated);
        pushToSupabase({ skillGroups: updated });
      };

      const handleDeleteGroup = (groupId) => {
        const targetG = skillGroups.find(g => g.id === groupId);
        setConfirmDialog({
          open: true,
          title: "刪除分組確認",

            const updated = skillGroups.filter(g => g.id !== groupId);

            pushToSupabase({ skillGroups: updated });
            showNotice(`已刪除分組 [${targetG ? targetG.name : ''}]`, "info");
          }
        });
      };

      const handleResetBoard = () => {
        setConfirmDialog({
          open: true,
          title: "重置看板確認",
          message: "確定要重置看板嗎？所有機台的「操作員」與「預備員」將清空，且「機況」恢復為「正常運轉」（「料況」將保留不變）。",
          onConfirm: () => {
            const updated = machines.map(m => ({
              ...m,
              operator: "",
              backup: "",
              mStatus: "正常運轉"
            }));
            setMachines(updated);
            pushToSupabase({ machines: updated });
            showNotice("看板已重置！操作員與預備員已清空，機況已恢復為正常運轉，料況完整保留。", "success");
          }
        });
      };

      const assignedMap = useMemo(() => {
        const map = {};
        machines.forEach(m => {
          if (m.operator) map[m.operator] = { machineId: m.id, machineName: m.name, role: "操作員", type: m.type };
          if (m.backup) map[m.backup] = { machineId: m.id, machineName: m.name, role: "預備員", type: m.type };
        });
        return map;
      }, [machines]);

      const toggleAttendance = (name, isDuty) => {
        setAttendanceMap(prev => {
          const current = isDuty ? (prev[name] !== false) : !!prev[name];
          const nextVal = !current;
          let updatedMachines = machines;
          
          if (!nextVal) {
            updatedMachines = machines.map(m => {
              let updated = { ...m };
              if (updated.operator === name) updated.operator = "";
              if (updated.backup === name) updated.backup = "";
              return updated;
            });
            setMachines(updatedMachines);
          }

          const nextAttendance = { ...prev, [name]: nextVal };
          pushToSupabase({ attendanceMap: nextAttendance, machines: updatedMachines });
          return nextAttendance;
        });
      };

      const selectAllDuty = () => {

          const next = { ...prev };

          pushToSupabase({ attendanceMap: next });
          return next;
        });
      };

      const deselectAllDuty = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentDutyPool.forEach(p => { next[p] = false; });
          const updatedMachines = machines.map(m => {
            let updated = { ...m };
            if (currentDutyPool.includes(updated.operator)) updated.operator = "";
            if (currentDutyPool.includes(updated.backup)) updated.backup = "";
            return updated;
          });
          setMachines(updatedMachines);
          pushToSupabase({ attendanceMap: next, machines: updatedMachines });
          return next;
        });
      };

      const selectAllSupport = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentSupportPool.forEach(p => { next[p] = true; });
          pushToSupabase({ attendanceMap: next });
          return next;
        });
      };

      const deselectAllSupport = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentSupportPool.forEach(p => { next[p] = false; });
          const updatedMachines = machines.map(m => {
            let updated = { ...m };
            if (currentSupportPool.includes(updated.operator)) updated.operator = "";
            if (currentSupportPool.includes(updated.backup)) updated.backup = "";
            return updated;
          });
          setMachines(updatedMachines);
          pushToSupabase({ attendanceMap: next, machines: updatedMachines });
          return next;
        });
      };

      const dutyCheckedCount = useMemo(() => {
        return currentDutyPool.filter(p => attendanceMap[p] !== false).length;
      }, [currentDutyPool, attendanceMap]);

      const supportCheckedCount = useMemo(() => {
        return currentSupportPool.filter(p => !!attendanceMap[p]).length;
      }, [currentSupportPool, attendanceMap]);

      const unassignedPeople = useMemo(() => {
        const dutyPresent = currentDutyPool.filter(p => attendanceMap[p] !== false);
        const supportPresent = currentSupportPool.filter(p => !!attendanceMap[p]);
        const allPresent = [...dutyPresent, ...supportPresent];
        return allPresent.filter(p => !assignedMap[p]);
      }, [currentDutyPool, currentSupportPool, attendanceMap, assignedMap]);

      const stats = useMemo(() => {
        const expectedCount = currentDutyPool.length;
        const actualCount = dutyCheckedCount + supportCheckedCount;
        const overtimeCount = supportCheckedCount;

        const excludedNames = ["領班", "QC", "極片搬運", "折彎機"];
        const running = machines.filter(m => m.mStatus === "正常運轉" && !excludedNames.includes(m.name)).length;
        const down = machines.filter(m => m.mStatus === "設備異常" && !excludedNames.includes(m.name)).length;
        const maint = machines.filter(m => m.mStatus === "停機保養" && !excludedNames.includes(m.name)).length;

        return { expectedCount, actualCount, overtimeCount, running, down, maint };
      }, [machines, currentDutyPool, dutyCheckedCount, supportCheckedCount]);

      const filteredMachines = useMemo(() => {
        return machines.filter(m => {
          const matchType = filterType === "ALL" || m.type === filterType;
          const matchStatus = filterStatus === "ALL" || m.mStatus === filterStatus;
          const query = searchTerm.trim().toLowerCase();
          const matchSearch = !query || 
            m.name.toLowerCase().includes(query) ||
            m.type.toLowerCase().includes(query) ||
            (m.operator && m.operator.toLowerCase().includes(query)) ||
            (m.backup && m.backup.toLowerCase().includes(query));
          return matchType && matchStatus && matchSearch;
        });
      }, [machines, filterType, filterStatus, searchTerm]);

      const filteredSkillGroups = useMemo(() => {
        if (!groupSearchTerm.trim()) return skillGroups;
        const q = groupSearchTerm.trim().toLowerCase();
        return skillGroups.filter(g => g.name.toLowerCase().includes(q));
      }, [skillGroups, groupSearchTerm]);

      const handleRemovePersonnel = (machineId, role, e) => {
        if (e) e.stopPropagation();
        const targetM = machines.find(m => m.id === machineId);
        const group = targetM ? REWINDER_GROUPS.find(g => g.members.includes(targetM.name)) : null;
        const targetNames = group ? group.members : [targetM?.name];

        const updated = machines.map(m => {
          if (targetNames.includes(m.name)) {
            return { ...m, [role]: "" };
          }
          return m;
        });
        setMachines(updated);
        pushToSupabase({ machines: updated });
        showNotice("已移除該欄位指派人員", "info");
      };

      const handleAssignPersonFromModal = (personName) => {
        const { machineId, role } = assignModal;
        if (!machineId || !role) return;

        const targetM = machines.find(m => m.id === machineId);
        const group = targetM ? REWINDER_GROUPS.find(g => g.members.includes(targetM.name)) : null;
        const targetNames = group ? group.members : [targetM?.name];

        const updated = machines.map(m => {
          let item = { ...m };
          if (item.operator === personName) item.operator = "";
          if (item.backup === personName) item.backup = "";

          if (targetNames.includes(item.name)) {
            item[role] = personName;
          }
          return item;
        });

        setMachines(updated);
        pushToSupabase({ machines: updated });
        setAssignModal({ open: false, machineId: null, role: null });
        showNotice(`已成功指派 [${personName}] 至 ${group ? group.name : targetM?.name}`, "success");
      };

      const handleSelectStatusFromModal = (val) => {
        const { machineId, type } = statusModal;
        if (!machineId || !type) return;

        const updated = machines.map(m => m.id === machineId ? { ...m, [type]: val } : m);
        setMachines(updated);
        pushToSupabase({ machines: updated });
        setStatusModal({ open: false, machineId: null, type: null });
        setIsManagingStatuses(false);
        showNotice("狀態更動完成", "info");
      };

      const handleCreateStatusOption = (type) => {
        if (!newStatusForm.label.trim()) return;
        const theme = COLOR_THEMES[newStatusForm.colorIndex] || COLOR_THEMES[0];
        const newOpt = {
          id: (type === "mStatus" ? "ms-" : "mat-") + Date.now(),
          label: newStatusForm.label.trim(),
          color: theme.color,
          badge: theme.badge,
          icon: theme.icon
        };

        if (type === "mStatus") {
          const updated = [...mStatusOptions, newOpt];
          setMStatusOptions(updated);
          pushToSupabase({ mStatusOptions: updated });
        } else {
          const updated = [...matStatusOptions, newOpt];
          setMatStatusOptions(updated);
          pushToSupabase({ matStatusOptions: updated });
        }

        setNewStatusForm({ label: "", colorIndex: 0 });
        showNotice(`已新增${type === "mStatus" ? "機況" : "料況"}選項 [${newOpt.label}]`, "success");
      };

      const handleSaveEditedStatusLabel = (type, id) => {
        if (!editingStatusLabel.trim()) return;
        if (type === "mStatus") {
          const updated = mStatusOptions.map(o => o.id === id ? { ...o, label: editingStatusLabel.trim() } : o);
          setMStatusOptions(updated);
          pushToSupabase({ mStatusOptions: updated });
        } else {
          const updated = matStatusOptions.map(o => o.id === id ? { ...o, label: editingStatusLabel.trim() } : o);
          setMatStatusOptions(updated);
          pushToSupabase({ matStatusOptions: updated });
        }
        setEditingStatusId(null);
        setEditingStatusLabel("");
        showNotice("已更新狀態名稱", "success");
      };

      const handleDeleteStatusOption = (type, id, label) => {
        setConfirmDialog({
          open: true,
          title: "刪除狀態選項確認",
          message: `確定要刪除「${label}」狀態選項嗎？`,
          onConfirm: () => {
            if (type === "mStatus") {
              const updated = mStatusOptions.filter(o => o.id !== id);
              setMStatusOptions(updated);
              pushToSupabase({ mStatusOptions: updated });
            } else {
              const updated = matStatusOptions.filter(o => o.id !== id);
              setMatStatusOptions(updated);
              pushToSupabase({ matStatusOptions: updated });
            }
            showNotice(`已刪除狀態選項 [${label}]`, "info");
          }
        });
      };

      const handleCreateMachine = (e) => {
        e.preventDefault();
        if (!newMachine.name.trim()) return;
        const id = "m-" + Date.now();
        const updated = [...machines, { ...newMachine, id }];
        setMachines(updated);
        pushToSupabase({ machines: updated });
        setShowAddModal(false);
        setNewMachine({ type: machineTypes[0] || "", name: "", operator: "", backup: "", mStatus: "正常運轉", matStatus: "" });
        showNotice(`已建立新機台 [${newMachine.name}]`, "success");
      };

      const generateReportText = () => {
        let text = `【製造管理看板 - 當前現場排班與機況概況】\n`;
        text += `產生時間：${currentTime}\n`;
        text += `========================================\n`;
        machines.forEach((m, idx) => {
          text += `${idx + 1}. [${m.type || '通用'}] ${m.name} | 操作員: ${m.operator || '未指派'} | 預備員: ${m.backup || '無'} | 機況: ${m.mStatus} | 料況: ${m.matStatus || '未設定'}\n`;
        });
        text += `========================================\n`;
        text += `統計：應到 ${stats.expectedCount} 人 | 實到 ${stats.actualCount} 人 | 加班 ${stats.overtimeCount} 人 | 正常運轉 ${stats.running} 台 (排除非設備) | 設備異常 ${stats.down} 台 | 停機保養 ${stats.maint} 台`;
        return text;
      };

      const handleCopyToClipboard = () => {
        const text = generateReportText();
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          showNotice("排班概況表已複製到剪貼簿！", "success");
        } catch (err) {
          showNotice("複製失敗，請手動選取文字複製", "error");
        }
        document.body.removeChild(textarea);
      };

      if (userRole === null) {
        return (
          <div className="min-h-screen bg-industrial-950 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
              
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center text-3xl mx-auto shadow-lg shadow-blue-500/30">
                  🏭
                </div>
                <h1 className="text-2xl font-black tracking-wider text-slate-100">
                  製造管理看板
                </h1>
                <p className="text-xs text-slate-400">Smart Shopfloor Control Board (Cloud Edition)</p>
                <div className="pt-1">
                  <span className={`text-[10px] px-2 py-0.5 rounded-full border ${
                    supabaseConnected 
                      ? "bg-emerald-950 text-emerald-300 border-emerald-700" 
                      : "bg-amber-950 text-amber-300 border-amber-700"
                  }`}>
                    {supabaseConnected ? "🟢 Supabase 雲端實時連線" : "🟡 單機 LocalStorage 模式"}
                  </span>
                </div>
              </div>

              <div className="space-y-4 pt-2">
                <div className="bg-slate-950/80 border border-slate-800 p-4 rounded-xl space-y-2 hover:border-slate-700 transition">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-bold text-slate-200 flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                      1. 檢視者模式 (靜態瀏覽)
                    </span>
                    <span className="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full"> 免密碼 </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    僅觀看現場實時機況與動態看板，不具備編輯與排班權限。
                  </p>
                  <button
                    onClick={() => {
                      setUserRole("viewer");
                      showNotice("已進入檢視者模式", "info");
                    }}
                    className="w-full bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow"
                  >
                    進入觀看看板
                  </button>
                </div>

                <form onSubmit={handleAdminLogin} className="bg-slate-950/80 border border-slate-800 p-4 rounded-xl space-y-3 hover:border-slate-700 transition">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-bold text-slate-200 flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                      2. 管理員登入 (全權限)
                    </span>
                    <span className="text-[10px] bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded-full"> 需要密碼 </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    可調整人員派工、增修機台/機台類型、設定機況料況及重置看板。
                  </p>

                  <div className="space-y-2">
                    <input
                      type="password"
                      placeholder="請輸入管理員密碼 (預設: 0000)"
                      value={inputPassword}
                      onChange={e => {
                        setInputPassword(e.target.value);
                        setLoginError("");
                      }}
                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500"
                    />
                    {loginError && (
                      <div className="text-[11px] text-rose-400 font-medium">
                        ⚠️ {loginError}
                      </div>
                    )}
                    <button
                      type="submit"
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow"
                    >
                      管理員登入
                    </button>
                  </div>
                </form>
              </div>

              <div className="flex items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-800">
                <span>預設管理員密碼：<code className="text-blue-400 font-mono">0000</code></span>
                <button
                  onClick={() => setShowSupabaseModal(true)}
                  className="text-blue-400 hover:underline flex items-center"
                >
                  <IconCloud /> 設定 Supabase 雲端
                </button>
              </div>

            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-industrial-950">
          
          {/* Header */}

                                          className={`flex items-center justify-between p-1 rounded text-[11px] cursor-pointer border transition select-none ${
                                            isChecked
                                              ? "bg-purple-950 border-purple-700 text-purple-100 font-medium"
                                              : "bg-slate-950/60 border-slate-800/80 text-slate-500 opacity-70"
                                          }`}
                                        >
                                          <span>{p}</span>
                                          <input
                                            type="checkbox"
                                            checked={isChecked}
                                            onChange={() => handleToggleMemberInGroup(activeGroup.id, p)}
                                            className="rounded border-purple-600 text-purple-600 focus:ring-purple-500 w-3 h-3 bg-slate-900"
                                          />
                                        </label>
                                      );
                                    })}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>

                        </div>
                      );
                    })()}
                  </div>

                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end shrink-0">
                  <button
                    onClick={() => setShowGroupModal(false)}
                    className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-1.5 rounded-lg text-xs font-semibold shadow"
                  >
                    儲存並完成設定
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Machine & Material Status Options Modal */}
          {statusModal.open && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
                
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    {statusModal.type === "mStatus" ? "變更【機況】狀態" : "變更【料況】狀態"}
                  </h3>
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setIsManagingStatuses(!isManagingStatuses)}
                      className={`text-xs px-2.5 py-1 rounded border transition ${
                        isManagingStatuses 
                          ? "bg-blue-600 text-white border-blue-500 font-bold" 
                          : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700"
                      }`}
                    >
                      {isManagingStatuses ? "✓ 完成編輯" : "⚙️ 編輯/新增選項"}
                    </button>
                    <button 
                      onClick={() => {
                        setStatusModal({ open: false, machineId: null, type: null });
                        setIsManagingStatuses(false);
                      }}
                      className="text-slate-400 hover:text-white font-bold"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {!isManagingStatuses ? (
                  <div className="py-4 space-y-2 max-h-80 overflow-y-auto">
                    {statusModal.type === "matStatus" && (
                      <button
                        onClick={() => handleSelectStatusFromModal("")}
                        className="w-full p-2.5 rounded-lg border text-xs font-semibold flex items-center justify-between transition bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white"
                      >
                        <span>🚫 清空料況 (未設定)</span>
                        <span>選擇</span>
                      </button>
                    )}
                    
                    {(statusModal.type === "mStatus" ? mStatusOptions : matStatusOptions).map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => handleSelectStatusFromModal(opt.label)}
                        className={`w-full p-2.5 rounded-lg border text-xs font-semibold flex items-center justify-between transition ${opt.color}`}
                      >
                        <span className="flex items-center">
                          {statusModal.type === "mStatus" ? (
                            <span className={`w-2.5 h-2.5 rounded-full mr-2 ${opt.badge || 'bg-slate-400'}`}></span>
                          ) : (
                            <span className="mr-2 font-bold">{opt.icon || '✓'}</span>
                          )}
                          {opt.label}
                        </span>
                        <span>選擇</span>
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="py-3 space-y-4">
                    <p className="text-xs text-slate-400">
                      在此可增設、變更或刪除系統中可供選擇的{statusModal.type === "mStatus" ? "「機況」" : "「料況」"}選項。
                    </p>

                    <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                      {(statusModal.type === "mStatus" ? mStatusOptions : matStatusOptions).map(opt => (
                        <div key={opt.id} className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                          {editingStatusId === opt.id ? (
                            <div className="flex items-center space-x-2 flex-1 mr-2">
                              <input
                                type="text"
                                value={editingStatusLabel}
                                onChange={e => setEditingStatusLabel(e.target.value)}
                                className="flex-1 bg-slate-800 border border-slate-600 text-slate-200 text-xs px-2 py-1 rounded focus:outline-none"
                              />
                              <button
                                onClick={() => handleSaveEditedStatusLabel(statusModal.type, opt.id)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2 py-1 rounded"
                              >
                                儲存
                              </button>
                            </div>
                          ) : (
                            <span className={`text-xs px-2.5 py-1 rounded border font-semibold ${opt.color}`}>
                              {opt.icon ? `${opt.icon} ` : ""}{opt.label}
                            </span>
                          )}

                          <div className="flex items-center space-x-1">
                            {editingStatusId !== opt.id && (
                              <button
                                onClick={() => {
                                  setEditingStatusId(opt.id);
                                  setEditingStatusLabel(opt.label);
                                }}
                                className="text-slate-400 hover:text-slate-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                              >
                                編輯
                              </button>
                            )}
                            <button
                              onClick={() => handleDeleteStatusOption(statusModal.type, opt.id, opt.label)}
                              className="text-rose-400 hover:text-rose-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                            >
                              刪除
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <div className="text-xs font-semibold text-slate-300 mb-2">➕ 新增狀態選項</div>
                      <div className="space-y-2">
                        <input
                          type="text"
                          placeholder="請輸入狀態名稱..."
                          value={newStatusForm.label}
                          onChange={e => setNewStatusForm({ ...newStatusForm, label: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded focus:outline-none placeholder-slate-500"
                        />
                        <div className="flex items-center justify-between gap-2">
                          <select
                            value={newStatusForm.colorIndex}
                            onChange={e => setNewStatusForm({ ...newStatusForm, colorIndex: parseInt(e.target.value) })}
                            className="bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded flex-1 focus:outline-none"
                          >
                            {COLOR_THEMES.map((theme, idx) => (
                              <option key={idx} value={idx}>{theme.label}</option>
                            ))}
                          </select>
                          <button
                            onClick={() => handleCreateStatusOption(statusModal.type)}
                            className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded"
                          >
                            新增選項
                          </button>
                        </div>
                      </div>
                    </div>

                  </div>
                )}

              </div>
            </div>
          )}

          {/* Export Report Modal */}
          {showExportModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-2xl w-full p-5 shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100 flex items-center">
                    📋 現場排班概況與機況總覽
                  </h3>
                  <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="py-4 flex-1 overflow-hidden flex flex-col">
                  <p className="text-xs text-slate-400 mb-2">
                    可複製下列格式化文字，快速貼至 LINE/Teams 等通訊軟體進行會報：
                  </p>
                  <textarea
                    readOnly
                    value={generateReportText()}
                    className="flex-1 w-full bg-slate-950 border border-slate-800 text-slate-300 font-mono text-xs p-3 rounded-lg focus:outline-none resize-none min-h-[250px]"
                  />
                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-md border border-slate-700"
                  >
                    關閉
                  </button>
                  <button
                    onClick={handleCopyToClipboard}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-md font-semibold flex items-center shadow"
                  >
                    <IconClipboard /> 一鍵複製概況表
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Add Machine Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100">
                    ➕ 新增機台
                  </h3>
                  <button 
                    onClick={() => {
                      setShowAddModal(false);
                      setIsManagingTypes(false);
                    }}
                    className="text-slate-400 hover:text-white font-bold"
                  >
                    ✕
                  </button>
                </div>

                {!isManagingTypes ? (
                  <form onSubmit={handleCreateMachine} className="py-4 space-y-3 text-xs">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-slate-400 font-medium">1. 機台類型</label>
                        <button
                          type="button"
                          onClick={() => setIsManagingTypes(true)}
                          className="text-[11px] text-blue-400 hover:text-blue-300 underline font-medium"
                        >
                          ⚙️ 管理機台類型選項
                        </button>
                      </div>
                      <select
                        value={newMachine.type}
                        onChange={e => setNewMachine({ ...newMachine, type: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                      >
                        <option value="">(無類型/通用)</option>
                        {machineTypes.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-medium">2. 機台名稱 / 代號</label>
                      <input
                        type="text"
                        placeholder="例如: W50, RW20..."
                        required
                        value={newMachine.name}
                        onChange={e => setNewMachine({ ...newMachine, name: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none placeholder-slate-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">初始機況</label>
                        <select
                          value={newMachine.mStatus}
                          onChange={e => setNewMachine({ ...newMachine, mStatus: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                        >
                          {mStatusOptions.map(o => (
                            <option key={o.id} value={o.label}>{o.label}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">初始料況</label>
                        <select
                          value={newMachine.matStatus}
                          onChange={e => setNewMachine({ ...newMachine, matStatus: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                        >
                          <option value="">(未設定)</option>
                          {matStatusOptions.map(o => (
                            <option key={o.id} value={o.label}>{o.label}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                      <button
                        type="button"
                        onClick={() => setShowAddModal(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded border border-slate-700"
                      >
                        取消
                      </button>
                      <button
                        type="submit"
                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-semibold"
                      >
                        新增機台
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="py-4 space-y-4 text-xs">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                      <span className="font-bold text-slate-200">⚙️ 機台類型列表管理</span>
                      <button
                        type="button"
                        onClick={() => setIsManagingTypes(false)}
                        className="text-blue-400 hover:text-blue-300 underline font-medium"
                      >
                        ← 返回新增機台
                      </button>
                    </div>

                    <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                      {machineTypes.map((type, index) => (
                        <div key={index} className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                          {editingTypeIndex === index ? (
                            <div className="flex items-center space-x-2 flex-1 mr-2">
                              <input
                                type="text"
                                value={editingTypeValue}
                                onChange={e => setEditingTypeValue(e.target.value)}
                                className="flex-1 bg-slate-800 border border-slate-600 text-slate-200 text-xs px-2 py-1 rounded focus:outline-none"
                              />
                              <button
                                type="button"
                                onClick={() => handleSaveEditMachineType(index)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded font-medium"
                              >
                                儲存
                              </button>
                            </div>
                          ) : (
                            <span className="font-bold text-slate-200 px-2 py-0.5 bg-slate-800 rounded border border-slate-700">
                              {type}
                            </span>
                          )}

                          <div className="flex items-center space-x-1">
                            {editingTypeIndex !== index && (
                              <button
                                type="button"
                                onClick={() => {
                                  setEditingTypeIndex(index);
                                  setEditingTypeValue(type);
                                }}
                                className="text-slate-400 hover:text-slate-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                              >
                                編輯
                              </button>
                            )}
                            <button
                              type="button"
                              onClick={() => handleDeleteMachineType(type)}
                              className="text-rose-400 hover:text-rose-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                            >
                              刪除
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <label className="block text-slate-300 font-semibold mb-1">➕ 新增機台類型</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="例如: 裁切機, 塗布機..."
                          value={newTypeName}
                          onChange={e => setNewTypeName(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded focus:outline-none placeholder-slate-500"
                        />
                        <button
                          type="button"
                          onClick={handleAddMachineType}
                          className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded"
                        >
                          新增類型
                        </button>
                      </div>
                    </div>

                    <div className="pt-2 flex justify-end">
                      <button
                        type="button"
                        onClick={() => setIsManagingTypes(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-1.5 rounded text-xs border border-slate-700"
                      >
                        完成返回
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* Password Change Modal */}
          {showChangePwModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    🔒 修改管理員密碼
                  </h3>
                  <button 
                    onClick={() => {
                      setShowChangePwModal(false);
                      setPwError("");
                    }}
                    className="text-slate-400 hover:text-white font-bold"
                  >
                    ✕
                  </button>
                </div>
                
                <form onSubmit={handleChangePassword} className="py-4 space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">1. 原密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請輸入目前密碼"
                      value={pwForm.oldPw}
                      onChange={e => setPwForm({ ...pwForm, oldPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">2. 新密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請輸入新密碼 (至少 4 位)"
                      value={pwForm.newPw}
                      onChange={e => setPwForm({ ...pwForm, newPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">3. 確認新密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請再次輸入新密碼"
                      value={pwForm.confirmPw}
                      onChange={e => setPwForm({ ...pwForm, confirmPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  {pwError && (
                    <div className="text-[11px] text-rose-400 font-medium pt-1">
                      ⚠️ {pwError}
                    </div>
                  )}

                  <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => {
                        setShowChangePwModal(false);
                        setPwError("");
                      }}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded border border-slate-700"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded font-semibold"
                    >
                      確認更新密碼
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-950 border-t border-slate-900 py-3 text-center text-xs text-slate-500">
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
