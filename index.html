    const getS4Default = (year, month, day) => {
      const shiftCycle = ['日', '夜', '夜', '日', '日', '夜', '夜', '日', '日', '夜', '夜', '日'];
      const utcEpoch = Date.UTC(2025, 11, 31);
      const utcTarget = Date.UTC(year, month - 1, day);
      const diffDays = Math.floor((utcTarget - utcEpoch) / (1000 * 60 * 60 * 24));
      const cycleDay = ((diffDays % 4) + 4) % 4;
      if (cycleDay === 0 || cycleDay === 1) {
        let mIdx = month - 1;
        if (cycleDay === 1) {
          const prevDay = new Date(year, month - 1, day - 1);
          mIdx = prevDay.getMonth();
        }
        return shiftCycle[mIdx] || '';
      }
      return '';
    };

    const getDefaultShift = (squad, year, month, day) => {
      const s4Val = getS4Default(year, month, day);
      if (squad === 'S4') return s4Val;
      if (squad === 'S3') {
        if (s4Val === '日') return '夜';
        if (s4Val === '夜') return '日';
        return '';
      }
      const d = new Date(year, month - 1, day);
      d.setDate(d.getDate() - 2);
      const s2Val = getS4Default(d.getFullYear(), d.getMonth() + 1, d.getDate());
      if (squad === 'S2') return s2Val;
      if (s2Val === '日') return '夜';
      if (s2Val === '夜') return '日';
      return '';
    };

      const [editingStatusLabel, setEditingStatusLabel] = useState("");
      const [newStatusForm, setNewStatusForm] = useState({ label: "", colorIndex: 0 });

      const [showExportModal, setShowExportModal] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);

      const [isManagingTypes, setIsManagingTypes] = useState(false);
      const [editingTypeIndex, setEditingTypeIndex] = useState(null);
      const [editingTypeValue, setEditingTypeValue] = useState("");
      const [newTypeName, setNewTypeName] = useState("");

      const [newMachine, setNewMachine] = useState({ type: "羅得B", name: "", operator: "", backup: "", mStatus: "正常運轉", matStatus: "" });
      const [currentTime, setCurrentTime] = useState(new Date().toLocaleString('zh-TW', { hour12: false }));

      const [pendingAction, setPendingAction] = useState(null);
      const [showUnsavedPrompt, setShowUnsavedPrompt] = useState(false);

      const isDirty = useMemo(() => {
        if (userRole !== 'admin') return false;
        if (!savedSnapshot) return false;
        return JSON.stringify(machines) !== JSON.stringify(savedSnapshot.machines) ||
               JSON.stringify(attendanceMap) !== JSON.stringify(savedSnapshot.attendanceMap);
      }, [userRole, machines, attendanceMap, savedSnapshot]);

      const isDirtyRef = useRef(isDirty);
      useEffect(() => { isDirtyRef.current = isDirty; }, [isDirty]);

      const selectedDateRef = useRef(selectedDate);
      useEffect(() => { selectedDateRef.current = selectedDate; }, [selectedDate]);

      const selectedShiftTimeRef = useRef(selectedShiftTime);
      useEffect(() => { selectedShiftTimeRef.current = selectedShiftTime; }, [selectedShiftTime]);

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date().toLocaleString('zh-TW', { hour12: false }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        localStorage.setItem("mfg_board_machines_v8", JSON.stringify(machines));
        localStorage.setItem("mfg_board_machine_types_v3", JSON.stringify(machineTypes));
        localStorage.setItem("mfg_board_mstatus_opt_v4", JSON.stringify(mStatusOptions));
        localStorage.setItem("mfg_board_matstatus_opt_v4", JSON.stringify(matStatusOptions));
        localStorage.setItem("mfg_board_skill_groups_v4", JSON.stringify(skillGroups));
        localStorage.setItem("mfg_board_attendance_v6", JSON.stringify(attendanceMap));
        localStorage.setItem("mfg_board_schedules_map_v1", JSON.stringify(schedulesMap));
      }, [machines, machineTypes, mStatusOptions, matStatusOptions, skillGroups, attendanceMap, schedulesMap]);

      useEffect(() => {
        if (!selectedDate) return;
        const [y, m, d] = selectedDate.split('-').map(Number);
        const squads = ['S1', 'S2', 'S3', 'S4'];
        const matchedSquad = squads.find(sq => getDefaultShift(sq, y, m, d) === selectedShiftTime);
        if (matchedSquad && matchedSquad !== currentShift) {
          setCurrentShift(matchedSquad);
        }
      }, [selectedDate, selectedShiftTime]);

      const getPersonScheduledShift = (squad, personName) => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const key = `${squad}_shift_${y}_${m}_${personName}_${d}`;
        if (scheduledShifts[key] !== undefined && scheduledShifts[key] !== null) {
          return scheduledShifts[key];
        }
        return getDefaultShift(squad, y, m, d);
      };

      const categorizedPersonnel = useMemo(() => {
        const [y, m, d] = selectedDate.split('-').map(Number);
        const duty = [];
        const support = [];

        const squads = ['S1', 'S2', 'S3', 'S4'];
        const dutySquad = squads.find(sq => getDefaultShift(sq, y, m, d) === selectedShiftTime) || currentShift;
        const targetSupportSquad = SHIFT_PAIR_MAP[dutySquad] || "S2";

        const dutyMembers = squadRosters[dutySquad] || [];
        dutyMembers.forEach(person => {
          const sVal = getPersonScheduledShift(dutySquad, person);
          duty.push({ name: person, squad: dutySquad, schedShift: sVal || selectedShiftTime });
        });

        const supportMembers = squadRosters[targetSupportSquad] || [];
        supportMembers.forEach(person => {
          const sVal = getPersonScheduledShift(targetSupportSquad, person);
          support.push({ name: person, squad: targetSupportSquad, schedShift: sVal });
        });

        return { duty, support, dutySquad, supportSquad: targetSupportSquad };
      }, [selectedDate, selectedShiftTime, currentShift, squadRosters, scheduledShifts]);

      const currentDutyPool = useMemo(() => categorizedPersonnel.duty.map(p => p.name), [categorizedPersonnel]);
      const currentSupportPool = useMemo(() => categorizedPersonnel.support.map(p => p.name), [categorizedPersonnel]);

      useEffect(() => {
        if (!supabaseUrl || !supabaseKey || !window.supabase) {
          setSupabaseConnected(false);
          return;
        }

        let channel = null;
        let pollingInterval = null;

        const checkWebSocketSupport = () => {
          if (typeof WebSocket === 'undefined') return false;
          try {
            const host = supabaseUrl.replace(/^https?:\/\//, '');
            const testWs = new WebSocket(`wss://${host}/realtime/v1/websocket?apikey=${supabaseKey}&vsn=2.0.0`);
            testWs.close();
            return true;
          } catch (e) {
            return false;
          }
        };

        const wsSupported = checkWebSocketSupport();

        try {
          const client = window.supabase.createClient(supabaseUrl, supabaseKey);
          supabaseRef.current = client;

          const fetchInitial = async () => {
            try {
              const { data: settingsData } = await client.from('settings').select('key, value');
              if (settingsData && settingsData.length > 0) {
                const newRosters = { ...squadRosters };
                ['S1', 'S2', 'S3', 'S4'].forEach(sq => {
                  const settingRow = settingsData.find(r => r.key === `${sq}_employees`);
                  if (settingRow && settingRow.value) {
                    try {
                      const list = JSON.parse(settingRow.value);
                      if (Array.isArray(list) && list.length > 0) {
                        newRosters[sq] = list;
                      }
                    } catch(e){}
                  }
                });
                setSquadRosters(newRosters);
              }
            } catch(e) {}

            try {
              const { data, error } = await client.from('mfg_board').select('*').eq('id', 'global_state').single();
              if (error && error.code !== 'PGRST116') throw error;
              if (data && data.data) {
                const cloudState = data.data;
                if (cloudState.machineTypes) setMachineTypes(cloudState.machineTypes);
                if (cloudState.skillGroups) setSkillGroups(cloudState.skillGroups);
                if (cloudState.mStatusOptions) setMStatusOptions(cloudState.mStatusOptions);
                if (cloudState.matStatusOptions) setMatStatusOptions(cloudState.matStatusOptions);
                if (cloudState.schedulesMap) setSchedulesMap(cloudState.schedulesMap);

                const shiftKey = `${selectedDateRef.current}_${selectedShiftTimeRef.current}`;
                const shiftData = cloudState.schedulesMap && cloudState.schedulesMap[shiftKey];
                if (shiftData) {
                  setMachines(shiftData.machines || DEFAULT_MACHINES);
                  setAttendanceMap(shiftData.attendanceMap || {});
                  setSavedSnapshot(JSON.parse(JSON.stringify(shiftData)));
                } else if (cloudState.machines) {
                  setMachines(cloudState.machines);
                  setAttendanceMap(cloudState.attendanceMap || {});
                  setSavedSnapshot(JSON.parse(JSON.stringify({ machines: cloudState.machines, attendanceMap: cloudState.attendanceMap || {} })));
                }
              }
              setSupabaseConnected(true);
            } catch(e) {
              setSupabaseConnected(false);
              setSupabaseErrorMsg((e && e.message) || "無法連線至 Supabase");
            }
          };

          fetchInitial();

          if (wsSupported) {
            try {
              channel = client.channel('mfg_board_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'mfg_board', filter: 'id=eq.global_state' }, payload => {
                  if (payload.new && payload.new.data) {
                    const remote = payload.new.data;
                    if (remote.schedulesMap) setSchedulesMap(remote.schedulesMap);
                    
                    if (!isDirtyRef.current) {
                      const shiftKey = `${selectedDateRef.current}_${selectedShiftTimeRef.current}`;
                      const shiftData = remote.schedulesMap && remote.schedulesMap[shiftKey];
                      if (shiftData) {
                        setMachines(shiftData.machines);
                        setAttendanceMap(shiftData.attendanceMap || {});
                        setSavedSnapshot(JSON.parse(JSON.stringify(shiftData)));
                      }
                    }
                  }
                });

              channel.subscribe((status) => {
                setRealtimeMode(status === 'SUBSCRIBED' ? "WebSocket 實時" : "HTTP 輪詢");
              });
            } catch(wsErr) {
              setRealtimeMode("HTTP 輪詢");
            }
          }

          pollingInterval = setInterval(async () => {
            try {
              const { data, error } = await client.from('mfg_board').select('data').eq('id', 'global_state').single();
              if (error && error.code !== 'PGRST116') throw error;
              if (data && data.data) {
                const remote = data.data;
                if (remote.schedulesMap) setSchedulesMap(remote.schedulesMap);
                
                if (!isDirtyRef.current) {
                  const shiftKey = `${selectedDateRef.current}_${selectedShiftTimeRef.current}`;
                  const shiftData = remote.schedulesMap && remote.schedulesMap[shiftKey];
                  if (shiftData) {
                    setMachines(shiftData.machines);
                    setAttendanceMap(shiftData.attendanceMap || {});
                    setSavedSnapshot(JSON.parse(JSON.stringify(shiftData)));
                  }
                }
              }
              setSupabaseConnected(true);
            } catch(pollErr) {}
          }, 6000);

          return () => {
            if (channel) try { client.removeChannel(channel); } catch(e){}
            if (pollingInterval) clearInterval(pollingInterval);
          };
        } catch(err) {
          setSupabaseConnected(false);
        }
      }, [supabaseUrl, supabaseKey]);

      useEffect(() => {
        if (!supabaseRef.current || !selectedDate) return;
        const [y, m, d] = selectedDate.split('-').map(Number);
        const loadShifts = async () => {
          try {
            const { data } = await supabaseRef.current
              .from('shifts')
              .select('key, value')
              .like('key', `%_shift_${y}_${m}_%_${d}`);
            if (data) {
              const map = {};
              data.forEach(r => { map[r.key] = r.value; });
              setScheduledShifts(map);
            }
          } catch(err) {}
        };
        loadShifts();
      }, [selectedDate, supabaseConnected]);

      useEffect(() => {
        const shiftKey = `${selectedDate}_${selectedShiftTime}`;
        if (schedulesMap[shiftKey]) return;

        const nextAttendance = {};
        categorizedPersonnel.duty.forEach(item => {
          const sVal = item.schedShift;
          const isLeave = ['特', '病', '事', '公', '喪', '未'].includes(sVal);
          nextAttendance[item.name] = !isLeave;
        });

        categorizedPersonnel.support.forEach(item => {
          const sVal = item.schedShift;
          const isOvertime = (sVal === 'G');
          nextAttendance[item.name] = isOvertime;
        });

        setAttendanceMap(nextAttendance);
        setSavedSnapshot({ machines, attendanceMap: nextAttendance });
      }, [selectedDate, selectedShiftTime, categorizedPersonnel, schedulesMap]);

      const pushToSupabase = async (updatedFields) => {
        if (!supabaseRef.current) return;
        try {
          const shiftKey = `${selectedDate}_${selectedShiftTime}`;
          const currentShiftSnap = {
            machines,
            attendanceMap,
            currentShift
          };

          const newSchedulesMap = {
            ...schedulesMap,
            [shiftKey]: currentShiftSnap,
            ...(updatedFields.schedulesMap || {})
          };

          const payloadState = {
            machines,
            currentShift,
            attendanceMap,
            machineTypes,
            skillGroups,
            mStatusOptions,
            matStatusOptions,
            schedulesMap: newSchedulesMap,
            ...updatedFields
          };

          const { error } = await supabaseRef.current.from('mfg_board').upsert({
            id: 'global_state',
            data: payloadState,
            updated_at: new Date().toISOString()
          });

          if (error) throw error;
          setSchedulesMap(newSchedulesMap);
          setSavedSnapshot({ machines, attendanceMap });
          setSupabaseConnected(true);
          showNotice("已成功儲存看板變更至 Supabase 雲端！", "success");
        } catch(err) {
          showNotice("⚠️ 雲端儲存失敗，資料僅保留在本機", "error");
        }
      };

      const handleSaveBoard = () => {
        pushToSupabase({});
      };

      const performShiftChange = (targetDate, targetShiftTime) => {
        const targetShiftKey = `${targetDate}_${targetShiftTime}`;
        const targetData = schedulesMap[targetShiftKey];

        if (targetData) {
          setMachines(targetData.machines || DEFAULT_MACHINES);
          setAttendanceMap(targetData.attendanceMap || {});
          setSavedSnapshot(JSON.parse(JSON.stringify(targetData)));
        } else {
          setMachines(DEFAULT_MACHINES.map(m => ({ ...m, operator: "", backup: "", mStatus: "正常運轉" })));
          setAttendanceMap({});
          setSavedSnapshot(JSON.parse(JSON.stringify({ machines: DEFAULT_MACHINES, attendanceMap: {} })));
        }

        setSelectedDate(targetDate);
        setSelectedShiftTime(targetShiftTime);
        showNotice(`已切換至 [${targetDate} ${targetShiftTime}班]`, "info");
      };

      const handleDateOrShiftChange = (targetDate, targetShiftTime) => {
        if (targetDate === selectedDate && targetShiftTime === selectedShiftTime) return;

        if (isDirty) {
          setPendingAction({ type: "SWITCH_DATE_SHIFT", targetDate, targetShiftTime });
          setShowUnsavedPrompt(true);
          return;
        }

        performShiftChange(targetDate, targetShiftTime);
      };

      const handleConfirmUnsavedPrompt = async (shouldSave) => {
        setShowUnsavedPrompt(false);
        if (shouldSave) {
          await pushToSupabase({});
        }

        if (pendingAction) {
          if (pendingAction.type === "SWITCH_DATE_SHIFT") {
            performShiftChange(pendingAction.targetDate, pendingAction.targetShiftTime);
          } else if (pendingAction.type === "LOGOUT") {
            setUserRole(null);
            showNotice("已成功登出", "info");
          }
          setPendingAction(null);
        }
      };

      const handleLogout = () => {
        if (isDirty) {
          setPendingAction({ type: "LOGOUT" });
          setShowUnsavedPrompt(true);
          return;
        }
        setUserRole(null);
        showNotice("已登出當前身份", "info");
      };

      const showNotice = (text, type = "info") => {
        setNoticeMessage({ text, type });
        setTimeout(() => setNoticeMessage(null), 3000);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (inputPassword === adminPassword) {
          setUserRole("admin");
          setInputPassword("");
          setLoginError("");
          showNotice("登入成功！歡迎使用管理員權限", "success");
        } else {
          setLoginError("密碼錯誤！(預設密碼為 0000)");
        }
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        if (pwForm.oldPw !== adminPassword) {
          setPwError("原密碼輸入錯誤！");
          return;
        }
        if (pwForm.newPw.length < 4) {
          setPwError("新密碼長度至少需 4 個字元！");
          return;
        }
        if (pwForm.newPw !== pwForm.confirmPw) {
          setPwError("兩次輸入的新密碼不一致！");
          return;
        }
        setAdminPassword(pwForm.newPw);
        localStorage.setItem("mfg_board_admin_pw_v3", pwForm.newPw);
        setShowChangePwModal(false);
        setPwForm({ oldPw: "", newPw: "", confirmPw: "" });
        setPwError("");
        showNotice("密碼已成功更新！", "success");
      };

      const handleAddMachineType = () => {
        const name = newTypeName.trim();
        if (!name) return;
        if (machineTypes.includes(name)) {
          showNotice("此機台類型已存在！", "error");
          return;
        }
        const updated = [...machineTypes, name];
        setMachineTypes(updated);
        setNewTypeName("");
        showNotice(`已新增機台類型 [${name}]`, "success");
      };

      const handleSaveEditMachineType = (index) => {
        const val = editingTypeValue.trim();
        if (!val) return;
        const oldType = machineTypes[index];
        const updatedTypes = machineTypes.map((t, i) => i === index ? val : t);
        const updatedMachines = machines.map(m => m.type === oldType ? { ...m, type: val } : m);
        setMachineTypes(updatedTypes);
        setMachines(updatedMachines);
        setEditingTypeIndex(null);
        setEditingTypeValue("");
        showNotice("已修改類型名稱！", "success");
      };

      const handleDeleteMachineType = (typeName) => {
        setConfirmDialog({
          open: true,
          title: "刪除機台類型確認",
          message: `確定要刪除「${typeName}」機台類型嗎？`,
          onConfirm: () => {
            const updatedTypes = machineTypes.filter(t => t !== typeName);
            setMachineTypes(updatedTypes);
            if (newMachine.type === typeName) {
              setNewMachine(prev => ({ ...prev, type: updatedTypes[0] || "" }));
            }
            if (filterType === typeName) setFilterType("ALL");
            showNotice(`已刪除機台類型 [${typeName}]`, "info");
          }
        });
      };

      const getMatchingSkillGroups = (machineName) => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        return validList.filter(g => Array.isArray(g.machines) && g.machines.includes(machineName));
      };

      const handleAddGroup = () => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        const newG = {
          id: "sg-" + Date.now(),
          name: "新技能分組",
          machines: [],
          members: []
        };
        const updated = [...validList, newG];
        setSkillGroups(updated);
        setSelectedGroupId(newG.id);
        showNotice("已建立新分組，請設定涵蓋機台與人員", "info");
      };

      const handleUpdateGroupName = (id, newName) => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        const updated = validList.map(g => g.id === id ? { ...g, name: newName } : g);
        setSkillGroups(updated);
      };

      const handleToggleMachineInGroup = (groupId, machineName) => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        const updated = validList.map(g => {
          if (g.id !== groupId) return g;
          const list = Array.isArray(g.machines) ? g.machines : [];
          const exists = list.includes(machineName);
          const next = exists ? list.filter(m => m !== machineName) : [...list, machineName];
          return { ...g, machines: next };
        });
        setSkillGroups(updated);
      };

      const handleToggleMemberInGroup = (groupId, personName) => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        const updated = validList.map(g => {
          if (g.id !== groupId) return g;
          const list = Array.isArray(g.members) ? g.members : [];
          const exists = list.includes(personName);
          const next = exists ? list.filter(m => m !== personName) : [...list, personName];
          return { ...g, members: next };
        });
        setSkillGroups(updated);
      };

      const handleDeleteGroup = (groupId) => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        const targetG = validList.find(g => g.id === groupId);
        setConfirmDialog({
          open: true,
          title: "刪除分組確認",
          message: `確定要刪除分組 [${targetG ? targetG.name : ''}] 嗎？`,
          onConfirm: () => {
            const updated = validList.filter(g => g.id !== groupId);
            setSkillGroups(updated);
            if (selectedGroupId === groupId) setSelectedGroupId(null);
            showNotice(`已刪除分組 [${targetG ? targetG.name : ''}]`, "info");
          }
        });
      };

      const handleResetBoard = () => {
        setConfirmDialog({
          open: true,
          title: "重置看板確認",
          message: "確定要重置看板嗎？所有機台的「操作員」與「預備員」將清空，且「機況」恢復為「正常運轉」（「料況」將保留不變）。",
          onConfirm: () => {
            const updated = machines.map(m => ({
              ...m,
              operator: "",
              backup: "",
              mStatus: "正常運轉"
            }));
            setMachines(updated);
            showNotice("看板已重置！操作員與預備員已清空，機況已恢復為正常運轉，料況完整保留。", "success");
          }
        });
      };

      const assignedMap = useMemo(() => {
        const map = {};
        machines.forEach(m => {
          if (m.operator) map[m.operator] = { machineId: m.id, machineName: m.name, role: "操作員", type: m.type };
          if (m.backup) map[m.backup] = { machineId: m.id, machineName: m.name, role: "預備員", type: m.type };
        });
        return map;
      }, [machines]);

      const toggleAttendance = (name, isDuty) => {
        setAttendanceMap(prev => {
          const itemObj = isDuty
            ? categorizedPersonnel.duty.find(i => i.name === name)
            : categorizedPersonnel.support.find(i => i.name === name);

          const schedShift = itemObj ? itemObj.schedShift : null;
          const isLeave = isDuty ? ['特', '病', '事', '公', '喪', '未'].includes(schedShift) : false;
          const defaultVal = isDuty ? !isLeave : (schedShift === 'G');
          const current = prev[name] !== undefined ? prev[name] : defaultVal;
          const nextVal = !current;

          if (!nextVal) {
            setMachines(prevM => prevM.map(m => {
              let updated = { ...m };
              if (updated.operator === name) updated.operator = "";
              if (updated.backup === name) updated.backup = "";
              return updated;
            }));
          }

          return { ...prev, [name]: nextVal };
        });
      };

      const selectAllDuty = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentDutyPool.forEach(p => { next[p] = true; });
          return next;
        });
      };

      const deselectAllDuty = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentDutyPool.forEach(p => { next[p] = false; });
          setMachines(prevM => prevM.map(m => {
            let updated = { ...m };
            if (currentDutyPool.includes(updated.operator)) updated.operator = "";
            if (currentDutyPool.includes(updated.backup)) updated.backup = "";
            return updated;
          }));
          return next;
        });
      };

      const selectAllSupport = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentSupportPool.forEach(p => { next[p] = true; });
          return next;
        });
      };

      const deselectAllSupport = () => {
        setAttendanceMap(prev => {
          const next = { ...prev };
          currentSupportPool.forEach(p => { next[p] = false; });
          setMachines(prevM => prevM.map(m => {
            let updated = { ...m };
            if (currentSupportPool.includes(updated.operator)) updated.operator = "";
            if (currentSupportPool.includes(updated.backup)) updated.backup = "";
            return updated;
          }));
          return next;
        });
      };

      const dutyCheckedCount = useMemo(() => {
        return categorizedPersonnel.duty.filter(item => {
          if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
          const sVal = item.schedShift;
          return ['特', '病', '事', '公', '喪', '未'].includes(sVal) ? false : true;
        }).length;
      }, [categorizedPersonnel.duty, attendanceMap]);

      const supportCheckedCount = useMemo(() => {
        return categorizedPersonnel.support.filter(item => {
          if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
          return item.schedShift === 'G';
        }).length;
      }, [categorizedPersonnel.support, attendanceMap]);

      const unassignedPeople = useMemo(() => {
        const dutyPresent = categorizedPersonnel.duty.filter(item => {
          if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
          const sVal = item.schedShift;
          return ['特', '病', '事', '公', '喪', '未'].includes(sVal) ? false : true;
        }).map(i => i.name);

        const supportPresent = categorizedPersonnel.support.filter(item => {
          if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
          return item.schedShift === 'G';
        }).map(i => i.name);

        const allPresent = [...dutyPresent, ...supportPresent];
        return allPresent.filter(p => !assignedMap[p]);
      }, [categorizedPersonnel, attendanceMap, assignedMap]);

      const stats = useMemo(() => {
        const expectedCount = categorizedPersonnel.duty.length;
        const dutyActualCount = dutyCheckedCount;
        const overtimeCount = supportCheckedCount;
        const actualCount = dutyCheckedCount + supportCheckedCount;
        const isCountedMachine = m => m.type !== "" || m.name === "折彎機";
        const running = machines.filter(m => m.mStatus === "正常運轉" && isCountedMachine(m)).length;
        const down = machines.filter(m => m.mStatus === "設備異常" && isCountedMachine(m)).length;
        const maint = machines.filter(m => m.mStatus === "停機保養" && isCountedMachine(m)).length;
        
        // 待料停機機台數（包含待料中、待正極片、待負極片、待TRAY停機等狀態）
        const isWaitingMaterial = m => m.matStatus && (m.matStatus.startsWith("待") || m.matStatus === "待料中");
        const waitingMaterial = machines.filter(m => isWaitingMaterial(m) && isCountedMachine(m)).length;

        return { expectedCount, dutyActualCount, actualCount, overtimeCount, running, down, maint, waitingMaterial };
      }, [categorizedPersonnel.duty, dutyCheckedCount, supportCheckedCount, machines]);

      // 計算有操機人員的機台類型與料況/型號統計 (排除 "通用" 類型)
      const machineModelCountsText = useMemo(() => {
        const counts = {};
        machines.forEach(m => {
          if (m.operator && m.type && m.type !== "通用" && m.matStatus) {
            const key = `${m.type}．${m.matStatus}`;
            counts[key] = (counts[key] || 0) + 1;
          }
        });
        const parts = Object.entries(counts).map(([key, count]) => `${key}*${count}`);
        return parts.length > 0 ? parts.join("；") : "";
      }, [machines]);

      const filteredMachines = useMemo(() => {
        const query = searchTerm.trim().toLowerCase();
        return machines.filter(m => {
          const matchType = filterType === "ALL" || m.type === filterType;
          const matchStatus = filterStatus === "ALL" || m.mStatus === filterStatus;
          const matchSearch = !query || 
            m.name.toLowerCase().includes(query) ||
            m.type.toLowerCase().includes(query) ||
            (m.operator && m.operator.toLowerCase().includes(query)) ||
            (m.backup && m.backup.toLowerCase().includes(query));
          return matchType && matchStatus && matchSearch;
        });
      }, [machines, filterType, filterStatus, searchTerm]);

      const filteredSkillGroups = useMemo(() => {
        const validList = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
        if (!groupSearchTerm.trim()) return validList;
        const q = groupSearchTerm.trim().toLowerCase();
        return validList.filter(g => g && g.name && g.name.toLowerCase().includes(q));
      }, [skillGroups, groupSearchTerm]);

      const handleRemovePersonnel = (machineId, role, e) => {
        if (e) e.stopPropagation();
        const targetM = machines.find(m => m.id === machineId);
        const group = targetM ? REWINDER_GROUPS.find(g => g.members.includes(targetM.name)) : null;
        const targetNames = group ? group.members : [targetM?.name];

        const updated = machines.map(m => {
          if (targetNames.includes(m.name)) {
            return { ...m, [role]: "" };
          }
          return m;
        });
        setMachines(updated);
        showNotice("已移除該欄位指派人員", "info");
      };

      const handleAssignPersonFromModal = (personName) => {
        const { machineId, role } = assignModal;
        if (!machineId || !role) return;

        const targetM = machines.find(m => m.id === machineId);
        const group = targetM ? REWINDER_GROUPS.find(g => g.members.includes(targetM.name)) : null;
        const targetNames = group ? group.members : [targetM?.name];

        const updated = machines.map(m => {
          let item = { ...m };
          if (item.operator === personName) item.operator = "";
          if (item.backup === personName) item.backup = "";

          if (targetNames.includes(item.name)) {
            item[role] = personName;
          }
          return item;
        });

        setMachines(updated);
        setAssignModal({ open: false, machineId: null, role: null });
        showNotice(`已指派 [${personName}] 至 ${group ? group.name : targetM?.name}`, "success");
      };

      const handleSelectStatusFromModal = (val) => {
        const { machineId, type } = statusModal;
        if (!machineId || !type) return;

        const updated = machines.map(m => m.id === machineId ? { ...m, [type]: val } : m);
        setMachines(updated);
        setStatusModal({ open: false, machineId: null, type: null });
        setIsManagingStatuses(false);
        showNotice("狀態更動完成", "info");
      };

      const handleCreateStatusOption = (type) => {
        if (!newStatusForm.label.trim()) return;
        const theme = COLOR_THEMES[newStatusForm.colorIndex] || COLOR_THEMES[0];
        const newOpt = {
          id: (type === "mStatus" ? "ms-" : "mat-") + Date.now(),
          label: newStatusForm.label.trim(),
          color: theme.color,
          badge: theme.badge
        };

        if (type === "mStatus") {
          setMStatusOptions([...mStatusOptions, newOpt]);
        } else {
          setMatStatusOptions([...matStatusOptions, newOpt]);
        }

        setNewStatusForm({ label: "", colorIndex: 0 });
        showNotice(`已新增${type === "mStatus" ? "機況" : "料況"}選項 [${newOpt.label}]`, "success");
      };

      const handleSaveEditedStatusLabel = (type, id) => {
        if (!editingStatusLabel.trim()) return;
        if (type === "mStatus") {
          setMStatusOptions(mStatusOptions.map(o => o.id === id ? { ...o, label: editingStatusLabel.trim() } : o));
        } else {
          setMatStatusOptions(matStatusOptions.map(o => o.id === id ? { ...o, label: editingStatusLabel.trim() } : o));
        }
        setEditingStatusId(null);
        setEditingStatusLabel("");
        showNotice("已更新狀態名稱", "success");
      };

      const handleDeleteStatusOption = (type, id, label) => {
        setConfirmDialog({
          open: true,
          title: "刪除狀態選項確認",

      const generateReportText = () => {
        const dutyPresentNames = categorizedPersonnel.duty
          .filter(item => {
            if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
            const sVal = item.schedShift;
            return ['特', '病', '事', '公', '喪', '未'].includes(sVal) ? false : true;
          })
          .map(i => i.name);

        const supportPresentNames = categorizedPersonnel.support
          .filter(item => {
            if (attendanceMap[item.name] !== undefined) return attendanceMap[item.name];
            return item.schedShift === 'G';

          .map(i => i.name);

        const assignedList = machines
          .filter(m => m.operator || m.backup)
          .map(m => ` • ${m.name} [${m.type || '通用'}]: 操作員 ${m.operator || '無'} | 預備員 ${m.backup || '無'} | 機況: ${m.mStatus}${m.matStatus ? ` | 料況: ${m.matStatus}` : ''}`);

📅 日期與班別: ${selectedDate} ${selectedShiftTime}班 (${categorizedPersonnel.dutySquad}當班)
----------------------------------------
📊 出勤統計:
 - 應到人數: ${stats.expectedCount} 人
 - 當班實到: ${stats.dutyActualCount} 人 (${dutyPresentNames.join("、") || "無"})
 - 加班支援: ${stats.overtimeCount} 人 (${supportPresentNames.join("、") || "無"})
 - 現場總實到: ${stats.actualCount} 人
 - 未指派工作: ${unassignedPeople.length} 人 (${unassignedPeople.join("、") || "全數安排"})

🏭 機台運轉現況:
 - 正常運轉: ${stats.running} 台 | 設備異常: ${stats.down} 台 | 停機保養: ${stats.maint} 台 | 待料停機: ${stats.waitingMaterial} 台

⚙️ 機台人員派工明細:
${assignedList.length > 0 ? assignedList.join("\n") : " (目前尚未派工)"}
`;
      };

            showNotice("已複製會報文字至剪貼簿！", "success");

            copyFallback(text);

          copyFallback(text);

        el.value = text;
        document.body.appendChild(el);

                  </div>
                  <p className="text-xs text-slate-400">
                    可調整人員派工、增修機台/機台類型、設定機況料況及重置看板。
                  </p>

                  <div className="space-y-2">
                    <input
                      type="password"

                        setInputPassword(e.target.value);
                        setLoginError("");

                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500"
                    />
                    {loginError && (
                      <div className="text-[11px] text-rose-400 font-medium">
                        ⚠️ {loginError}
                      </div>

                    <button
                      type="submit"
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow"
                    >
                      管理員登入
                    </button>
                  </div>
                </form>
              </div>

              <div className="text-center text-[11px] text-slate-500 pt-2 border-t border-slate-800">
                預設管理員密碼：<code className="text-blue-400 font-mono">0000</code>
              </div>

            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-industrial-950">
          
          {/* Header */}

            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
                <div className="flex items-center space-x-3">
                  <h1 className="text-xl font-black tracking-wider text-slate-100 flex items-center gap-2">
                    製造管理看板
                    <span className={`text-xs border px-2 py-0.5 rounded-full font-normal ${
                      userRole === 'admin' 
                        ? 'bg-purple-900/60 text-purple-300 border-purple-500/30' 
                        : 'bg-emerald-900/60 text-emerald-300 border-emerald-500/30'
                    }`}>
                      {userRole === 'admin' ? '🔑 管理員權限' : '👁️ 檢視者模式'}
                    </span>
                  </h1>
                </div>

                <div className="text-right md:hidden font-mono text-xs text-blue-400 bg-slate-800/80 px-2.5 py-1 rounded border border-slate-700">
                  {currentTime}
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center flex-wrap gap-2 w-full md:w-auto justify-end">
                
                {userRole === 'admin' && (
                  <>
                    <button
                      onClick={handleSaveBoard}
                      className={`px-3 py-1.5 rounded-md text-xs font-bold flex items-center transition shadow ${
                        isDirty
                          ? "bg-amber-500 hover:bg-amber-400 text-slate-950 animate-pulse shadow-amber-500/30"
                          : "bg-emerald-700 hover:bg-emerald-600 text-white"
                      }`}
                      title="儲存目前班別之點名與派工資訊至雲端"
                    >
                      💾 儲存看板 {isDirty ? "(未儲存)" : ""}
                    </button>

                    <button 
                      onClick={() => {
                        setIsManagingTypes(false);
                        setShowAddModal(true);
                      }}
                      className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md text-xs font-medium flex items-center transition shadow"
                    >
                      <IconPlus /> 新增機台
                    </button>
                    <button 
                      onClick={() => {
                        const validGroups = Array.isArray(skillGroups) && skillGroups.length > 0 ? skillGroups : DEFAULT_SKILL_GROUPS;
                        if (!skillGroups || skillGroups.length === 0) {
                          setSkillGroups(DEFAULT_SKILL_GROUPS);

                        setShowGroupModal(true);

                      className="bg-purple-700 hover:bg-purple-600 text-white px-3 py-1.5 rounded-md text-xs font-medium flex items-center transition shadow"

                    <button

                  const m = filteredMachines[split];
                  const group = REWINDER_GROUPS.find(g => g.members.includes(m.name));
                  if (!group) break;
                  const groupMachinesInView = filteredMachines.filter(item => group.members.includes(item.name));
                  if (groupMachinesInView[0].id === m.id) break;
                  split++;
                }

                const leftMachines = filteredMachines.slice(0, split);
                const rightMachines = filteredMachines.slice(split);

                const renderTable = (subMachines) => (
                  <div className="flex-1 overflow-hidden border border-slate-800/80 rounded-lg bg-slate-950/40 flex flex-col">

                              </td>
                            </tr>
                          ) : (
                            subMachines.map((machine) => {
                              const mOpt = mStatusOptions.find(o => o.label === machine.mStatus) || mStatusOptions[0] || { color: "bg-slate-800 text-slate-300 border-slate-700", badge: "bg-slate-400" };
                              const matOpt = matStatusOptions.find(o => o.label === machine.matStatus);

                              const group = REWINDER_GROUPS.find(g => g.members.includes(machine.name));

                              let groupSpan = 1;

                                const groupMachinesInView = subMachines.filter(m => group.members.includes(m.name));

                                        {machine.type}

                                  <td className="p-1.5">
                                    <span className="font-bold text-slate-100 text-xs">
                                      {machine.name}

                                      rowSpan={groupSpan}

                                        <div className="text-[9px] text-blue-400 font-semibold mb-0.5 pb-0.5 border-b border-blue-900/40 flex items-center justify-between">

                                            <IconUser /> {machine.operator}
                                          </span>
                                          {userRole === 'admin' && (
                                            <button 
                                              onClick={e => handleRemovePersonnel(machine.id, "operator", e)}
                                              className="text-blue-300 hover:text-white ml-1 opacity-70 group-hover:opacity-100 font-bold text-xs"

                                          {userRole === 'admin' ? `+ ${groupSpan > 1 ? '組別操作員' : '指派'}` : '未指派'}
                                        </div>
                                      )}
                                    </td>
                                  )}

                                  {isGroupFirst && (
                                    <td 
                                      rowSpan={groupSpan}
                                      className="p-1 border border-slate-800/80 rounded transition align-middle bg-slate-900/40 cursor-pointer"
                                      onClick={userRole === 'admin' ? () => setAssignModal({ open: true, machineId: machine.id, role: "backup" }) : undefined}

                                          <span>🔗 {group ? group.name.split(' ')[0] : '組別共用'}</span>

                                            <button 
                                              onClick={e => handleRemovePersonnel(machine.id, "backup", e)}
                                              className="text-purple-300 hover:text-white ml-1 opacity-70 group-hover:opacity-100 font-bold text-xs"
                                              title="移除指派"
                                            >
                                              ✕
                                            </button>
                                          )}
                                        </div>
                                      ) : (
                                        <div className={`border border-dashed border-slate-800 text-slate-500 py-1 px-1 rounded text-center text-[10px] font-medium ${userRole === 'admin' ? 'hover:border-purple-500' : ''}`}>
                                          {userRole === 'admin' ? `+ ${groupSpan > 1 ? '組別預備員' : '預備員'}` : '無'}
                                        </div>
                                      )}
                                    </td>
                                  )}

                                  <td className="p-1.5">
                                    {userRole === 'admin' ? (

                                      >
                                        <span className="flex items-center truncate">
                                          <span className={`w-1.5 h-1.5 rounded-full mr-1 shrink-0 ${mOpt.badge || 'bg-slate-400'}`}></span>
                                          <span className="truncate">{machine.mStatus}</span>
                                        </span>
                                        <span className="text-[9px] opacity-70 shrink-0">▾</span>
                                      </button>
                                    ) : (
                                      <div className={`px-1.5 py-0.5 rounded border text-[11px] font-semibold w-full flex items-center ${mOpt.color}`}>
                                        <span className={`w-1.5 h-1.5 rounded-full mr-1 shrink-0 ${mOpt.badge || 'bg-slate-400'}`}></span>
                                        <span className="truncate">{machine.mStatus}</span>
                                      </div>
                                    )}
                                  </td>

                                  <td className="p-1.5">
                                    {userRole === 'admin' ? (
                                      <button 
                                        onClick={() => {
                                          setStatusModal({ open: true, machineId: machine.id, type: "matStatus" });
                                          setIsManagingStatuses(false);

                                        className={`px-1.5 py-0.5 rounded border text-[11px] font-semibold w-full text-left flex items-center justify-between shadow-sm transition ${
                                          matOpt ? matOpt.color : "bg-slate-800/80 text-slate-400 border-slate-700 hover:border-slate-500 hover:text-slate-300"
                                        }`}
                                      >
                                        <span className="truncate">
                                          {machine.matStatus || "+ 料況"}
                                        </span>
                                        <span className="text-[9px] opacity-70 shrink-0">▾</span>
                                      </button>
                                    ) : (
                                      <div className={`px-1.5 py-0.5 rounded border text-[11px] font-semibold w-full flex items-center ${
                                        matOpt ? matOpt.color : "bg-slate-800/40 text-slate-500 border-slate-800"
                                      }`}>
                                        <span className="truncate">
                                          {machine.matStatus || "-"}
                                        </span>
                                      </div>
                                    )}
                                  </td>

                                  {userRole === 'admin' && (
                                    <td className="p-1 text-center">
                                      <button
                                        onClick={() => {

                                            open: true,
                                            title: "刪除機台確認",

                    {renderTable(leftMachines)}
                    {renderTable(rightMachines)}

                        <input
                          type="text"
                          placeholder="請輸入狀態名稱..."
                          value={newStatusForm.label}
                          onChange={e => setNewStatusForm({ ...newStatusForm, label: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded focus:outline-none placeholder-slate-500"
                        />
                        <div className="flex items-center justify-between gap-2">
                          <select
                            value={newStatusForm.colorIndex}
                            onChange={e => setNewStatusForm({ ...newStatusForm, colorIndex: parseInt(e.target.value) })}
                            className="bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded flex-1 focus:outline-none"
                          >
                            {COLOR_THEMES.map((theme, idx) => (
                              <option key={idx} value={idx}>{theme.label}</option>
                            ))}
                          </select>
                          <button
                            onClick={() => handleCreateStatusOption(statusModal.type)}
                            className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded"
                          >
                            新增選項
                          </button>
                        </div>
                      </div>
                    </div>

                  </div>
                )}

              </div>
            </div>
          )}

          {}
          {/* Export Report Modal */}
          {showExportModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-2xl w-full p-5 shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100 flex items-center">
                    📋 現場排班概況與機況總覽
                  </h3>
                  <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="py-4 flex-1 overflow-hidden flex flex-col">
                  <p className="text-xs text-slate-400 mb-2">
                    可複製下列格式化文字，快速貼至 LINE/Teams 等通訊軟體進行會報：
                  </p>
                  <textarea
                    readOnly
                    value={generateReportText()}
                    className="flex-1 w-full bg-slate-950 border border-slate-800 text-slate-300 font-mono text-xs p-3 rounded-lg focus:outline-none resize-none min-h-[250px]"
                  />
                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-md border border-slate-700"
                  >
                    關閉
                  </button>
                  <button
                    onClick={handleCopyToClipboard}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-md font-semibold flex items-center shadow"
                  >
                    <IconClipboard /> 一鍵複製概況表
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Add Machine Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100">
                    ➕ 新增機台
                  </h3>
                  <button 
                    onClick={() => {
                      setShowAddModal(false);
                      setIsManagingTypes(false);
                    }}
                    className="text-slate-400 hover:text-white font-bold"
                  >
                    ✕
                  </button>
                </div>

                {!isManagingTypes ? (
                  <form onSubmit={handleCreateMachine} className="py-4 space-y-3 text-xs">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-slate-400 font-medium">1. 機台類型</label>
                        <button
                          type="button"
                          onClick={() => setIsManagingTypes(true)}
                          className="text-[11px] text-blue-400 hover:text-blue-300 underline font-medium"
                        >
                          ⚙️ 管理機台類型選項
                        </button>
                      </div>
                      <select
                        value={newMachine.type}
                        onChange={e => setNewMachine({ ...newMachine, type: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                      >
                        <option value="">(無類型/通用)</option>
                        {machineTypes.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-medium">2. 機台名稱 / 代號</label>
                      <input
                        type="text"
                        placeholder="例如: W50, RW20..."
                        required
                        value={newMachine.name}
                        onChange={e => setNewMachine({ ...newMachine, name: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none placeholder-slate-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">初始機況</label>
                        <select
                          value={newMachine.mStatus}
                          onChange={e => setNewMachine({ ...newMachine, mStatus: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                        >
                          {mStatusOptions.map(o => (
                            <option key={o.id} value={o.label}>{o.label}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">初始料況</label>
                        <select
                          value={newMachine.matStatus}
                          onChange={e => setNewMachine({ ...newMachine, matStatus: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                        >
                          <option value="">(未設定)</option>
                          {matStatusOptions.map(o => (
                            <option key={o.id} value={o.label}>{o.label}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                      <button
                        type="button"
                        onClick={() => setShowAddModal(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded border border-slate-700"
                      >
                        取消
                      </button>
                      <button
                        type="submit"
                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-semibold"
                      >
                        新增機台
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="py-4 space-y-4 text-xs">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                      <span className="font-bold text-slate-200">⚙️ 機台類型列表管理</span>
                      <button
                        type="button"
                        onClick={() => setIsManagingTypes(false)}
                        className="text-blue-400 hover:text-blue-300 underline font-medium"
                      >
                        ← 返回新增機台
                      </button>
                    </div>

                    <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                      {machineTypes.map((type, index) => (
                        <div key={index} className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                          {editingTypeIndex === index ? (
                            <div className="flex items-center space-x-2 flex-1 mr-2">
                              <input
                                type="text"
                                value={editingTypeValue}
                                onChange={e => setEditingTypeValue(e.target.value)}
                                className="flex-1 bg-slate-800 border border-slate-600 text-slate-200 text-xs px-2 py-1 rounded focus:outline-none"
                              />
                              <button
                                type="button"
                                onClick={() => handleSaveEditMachineType(index)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1 rounded font-medium"
                              >
                                儲存
                              </button>
                            </div>
                          ) : (
                            <span className="font-bold text-slate-200 px-2 py-0.5 bg-slate-800 rounded border border-slate-700">
                              {type}
                            </span>
                          )}

                          <div className="flex items-center space-x-1">
                            {editingTypeIndex !== index && (
                              <button
                                type="button"
                                onClick={() => {
                                  setEditingTypeIndex(index);
                                  setEditingTypeValue(type);
                                }}
                                className="text-slate-400 hover:text-slate-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                              >
                                編輯
                              </button>
                            )}
                            <button
                              type="button"
                              onClick={() => handleDeleteMachineType(type)}
                              className="text-rose-400 hover:text-rose-200 text-xs px-2 py-1 bg-slate-800 rounded border border-slate-700"
                            >
                              刪除
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <label className="block text-slate-300 font-semibold mb-1">➕ 新增機台類型</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="例如: 裁切機, 塗布機..."
                          value={newTypeName}
                          onChange={e => setNewTypeName(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-700 text-slate-200 text-xs p-2 rounded focus:outline-none placeholder-slate-500"
                        />
                        <button
                          type="button"
                          onClick={handleAddMachineType}
                          className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded"
                        >
                          新增類型
                        </button>
                      </div>
                    </div>

                    <div className="pt-2 flex justify-end">
                      <button
                        type="button"
                        onClick={() => setIsManagingTypes(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-1.5 rounded text-xs border border-slate-700"
                      >
                        完成返回
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {}
          {/* Password Change Modal */}
          {showChangePwModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    🔒 修改管理員密碼
                  </h3>
                  <button 
                    onClick={() => {
                      setShowChangePwModal(false);
                      setPwError("");
                    }}
                    className="text-slate-400 hover:text-white font-bold"
                  >
                    ✕
                  </button>
                </div>
                
                <form onSubmit={handleChangePassword} className="py-4 space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">1. 原密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請輸入目前密碼"
                      value={pwForm.oldPw}
                      onChange={e => setPwForm({ ...pwForm, oldPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">2. 新密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請輸入新密碼 (至少 4 位)"
                      value={pwForm.newPw}
                      onChange={e => setPwForm({ ...pwForm, newPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">3. 確認新密碼</label>
                    <input
                      type="password"
                      required
                      placeholder="請再次輸入新密碼"
                      value={pwForm.confirmPw}
                      onChange={e => setPwForm({ ...pwForm, confirmPw: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded focus:outline-none"
                    />
                  </div>

                  {pwError && (
                    <div className="text-[11px] text-rose-400 font-medium pt-1">
                      ⚠️ {pwError}
                    </div>
                  )}

                  <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => {
                        setShowChangePwModal(false);
                        setPwError("");
                      }}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded border border-slate-700"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded font-semibold"
                    >
                      確認更新密碼
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-slate-950 border-t border-slate-900 py-3 text-center text-xs text-slate-500">
            製造管理看板 © 2026 - Supabase Connected ({realtimeMode})
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
